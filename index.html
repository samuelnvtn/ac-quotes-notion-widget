<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AC Quote OTD</title>
        <link rel="icon" type="image/x-icon" href="https://samuelnvtn.github.io/ac-quotes-notion-widget/img/ac.png" />
        <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.2.1/firebase-firestore.js"></script>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js"
            import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"

            const firebaseConfig = {
                apiKey: "AIzaSyBUHwNxhWXxikK0U5mRyDR3mRRrkwFXHH0",
                authDomain: "ac-quotes.firebaseapp.com",
                projectId: "ac-quotes",
                storageBucket: "ac-quotes.firebasestorage.app",
                messagingSenderId: "1067388109737",
                appId: "1:1067388109737:web:91a9406754fe833590fab8"
            }

            // init firebase
            initializeApp(firebaseConfig)

            // init services
            const db = getFirestore()

            // collection ref
            const colRef = collection(db, "quotes")

            let quotes = []

            // get collection data
            getDocs(colRef)
                .then(snapshot => {
                    snapshot.docs.forEach(doc => {
                        quotes.push({ ...doc.data() })
                    })
                    displayRandomQuote()
                    checkMidnight()
                })
                .catch(err => {
                    console.log(err.message)
                })

            function displayRandomQuote() {
                if (quotes.length === 0) return
                const randomIndex = Math.floor(Math.random() * Math.min(10, quotes.length))
                const quote = quotes[randomIndex]
                document.getElementById("txt").innerHTML = quote.text
                document.getElementById("char").innerHTML = quote.character
                document.getElementById("game").innerHTML = quote.game
            }

            function checkMidnight() {
                setInterval(() => {
                    const now = new Date()
                    if (now.getHours() === 0 && now.getMinutes() === 0) {
                        displayRandomQuote()
                    }
                }, 60 * 1000)
            }
        </script>

        <div>
            <img src="https://samuelnvtn.github.io/ac-quotes-notion-widget/img/ac.png" />
            <p id="txt"></p>
            <p id="char"></p>
            <p id="game"></p>
        </div>
    </body>
</html>
